name: Add Facebook comments

on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:            # "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Add comments to posts that are live
        env:
          FB_PAGES: ${{ secrets.FB_PAGES }}
        run: python cloud_comment.py
      - name: Save progress
        run: |
          git config user.name "comment-bot"
          git config user.email "comment-bot@users.noreply.github.com"
          git add -A pending done failed 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "comments update"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
